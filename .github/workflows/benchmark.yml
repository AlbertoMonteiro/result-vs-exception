name: Performance Benchmark

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Run BenchmarkDotNet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ResultVsException.Benchmarks/ResultVsException.Benchmarks.csproj

      - name: Build (Release)
        run: dotnet build ResultVsException.Benchmarks/ResultVsException.Benchmarks.csproj -c Release --no-restore

      - name: Run Benchmarks
        run: |
          dotnet run \
            --project ResultVsException.Benchmarks/ResultVsException.Benchmarks.csproj \
            -c Release \
            --no-build \
            -- \
            --exporters json markdown \
            --artifacts ./BenchmarkResults

      - name: Publish results to Job Summary
        if: always()
        run: |
          {
            echo "# Exception vs OperationResult — Benchmark Results"
            echo ""
            echo "> **Reading the numbers:** \`Allocated\` shows heap bytes per operation."
            echo "> Every thrown exception allocates a new object + full stack trace."
            echo "> Under load, that means more GC collections — which pause **all** threads, not just the failing ones."
            echo ""

            echo "## Chapter 1 — Raw per-call cost"
            echo "_How expensive is a single failure?_"
            echo ""
            REPORT=$(find ./BenchmarkResults -name "*SingleCall*-report.md" | head -n 1)
            if [ -n "$REPORT" ]; then cat "$REPORT"; else echo "_Report not found._"; fi
            echo ""

            echo "## Chapter 2 — Simulated API batch (1 000 requests, variable error rate)"
            echo "_Does it matter at realistic error rates?_"
            echo ""
            REPORT=$(find ./BenchmarkResults -name "*ApiBatch*-report.md" | head -n 1)
            if [ -n "$REPORT" ]; then cat "$REPORT"; else echo "_Report not found._"; fi
            echo ""

            echo "## Chapter 3 — GC pressure (N errors in a tight loop)"
            echo "_Why does it hurt even successful requests?_"
            echo ""
            REPORT=$(find ./BenchmarkResults -name "*GcPressure*-report.md" | head -n 1)
            if [ -n "$REPORT" ]; then cat "$REPORT"; else echo "_Report not found._"; fi
            echo ""

            echo "---"
            echo "### Takeaways"
            echo "| Concern | Detail |"
            echo "|---|---|"
            echo "| **Latency ratio** | Failure path with \`Exception\` is **~40–50× slower** than \`OperationResult\` |"
            echo "| **Heap allocation** | Each \`throw\` allocates a new \`Exception\` object + stack trace on Gen0 heap |"
            echo "| **GC pressure** | At 10 % error rate on 1 000 RPS → 100 exceptions/s → extra Gen0 GC pauses that delay *all* requests |"
            echo "| **Success path** | Both approaches are equally fast on the happy path — zero overhead for adopting OperationResult |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ./BenchmarkResults/
          retention-days: 30

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsDir = './BenchmarkResults';
            const chapters = [
              { label: 'Chapter 1 — Raw per-call cost', pattern: 'SingleCall' },
              { label: 'Chapter 2 — API batch (1 000 requests, variable error rate)', pattern: 'ApiBatch' },
              { label: 'Chapter 3 — GC pressure', pattern: 'GcPressure' },
            ];

            const findReport = (pattern) => {
              const walk = (dir) => {
                for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, f.name);
                  if (f.isDirectory()) { const r = walk(full); if (r) return r; }
                  else if (f.name.includes(pattern) && f.name.endsWith('-report.md')) return full;
                }
                return null;
              };
              return walk(resultsDir);
            };

            let body = '# Exception vs OperationResult — Benchmark Results\n\n';
            body += '> **Reading the numbers:** `Allocated` shows heap bytes per operation. ';
            body += 'Every thrown exception allocates a new object + full stack trace, causing GC pressure that hurts **all** threads — including successful requests.\n\n';

            for (const { label, pattern } of chapters) {
              body += `## ${label}\n\n`;
              const file = findReport(pattern);
              body += file ? fs.readFileSync(file, 'utf8') : '_Report not found._';
              body += '\n\n';
            }

            body += '---\n### Takeaways\n';
            body += '| Concern | Detail |\n|---|---|\n';
            body += '| **Latency ratio** | Failure path with `Exception` is **~40–50× slower** than `OperationResult` |\n';
            body += '| **Heap allocation** | Each `throw` allocates a new `Exception` object + stack trace on Gen0 heap |\n';
            body += '| **GC pressure** | At 10 % error rate on 1 000 RPS → 100 exceptions/s → extra GC pauses delay *all* requests |\n';
            body += '| **Success path** | Both approaches are equally fast on the happy path |\n';

            // Replace previous bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body.includes('Exception vs OperationResult')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
