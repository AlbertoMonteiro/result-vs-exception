name: Performance Benchmark

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Run BenchmarkDotNet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ResultVsException.Benchmarks/ResultVsException.Benchmarks.csproj

      - name: Build (Release)
        run: dotnet build ResultVsException.Benchmarks/ResultVsException.Benchmarks.csproj -c Release --no-restore

      - name: Run Benchmarks
        run: |
          dotnet run \
            --project ResultVsException.Benchmarks/ResultVsException.Benchmarks.csproj \
            -c Release \
            --no-build \
            -- \
            --exporters json markdown \
            --artifacts ./BenchmarkResults
        # BenchmarkDotNet writes results under ./BenchmarkResults by default when
        # --artifacts is provided. The markdown exporter produces a *.md file that
        # we can surface directly in the job summary.

      - name: Publish results to Job Summary
        if: always()
        run: |
          echo "## Benchmark Results – Exception vs OperationResult" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Find the generated markdown report and append it to the summary
          REPORT=$(find ./BenchmarkResults -name "*.md" | head -n 1)
          if [ -n "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No markdown report found. Check the benchmark artifacts._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ./BenchmarkResults/
          retention-days: 30

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const glob = require('glob');

            // Find the markdown report
            const files = fs.readdirSync('./BenchmarkResults', { recursive: true })
              .map(f => path.join('./BenchmarkResults', f))
              .filter(f => f.endsWith('.md'));

            let body = '## Benchmark Results – Exception vs OperationResult\n\n';
            if (files.length > 0) {
              body += fs.readFileSync(files[0], 'utf8');
            } else {
              body += '_No markdown report found. Check the benchmark artifacts._';
            }

            // Delete previous bot comments to avoid duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body.includes('Benchmark Results')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
